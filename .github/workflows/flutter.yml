name: Flutter Build - All Platforms
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Force Java 17 for Flutter
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          java -version
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.5', channel: 'stable' }
      - run: rm -rf android ios windows linux macos web
      - run: |
          mkdir -p /tmp/bak
          cp lib/main.dart /tmp/bak/main.dart
          cp pubspec.yaml /tmp/bak/pubspec.yaml
      - run: flutter create --overwrite --org com.safekey.app --project-name safekey .
      - run: |
          cp /tmp/bak/main.dart lib/main.dart
          cp /tmp/bak/pubspec.yaml pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: SafeKey-Android-APK, path: build/app/outputs/flutter-apk/app-release.apk }

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.5', channel: 'stable' }
      - run: Remove-Item -Recurse -Force android,ios,windows,linux,macos,web -ErrorAction SilentlyContinue
        shell: powershell
      - run: |
          Copy-Item lib/main.dart -Destination main.dart.bak
          Copy-Item pubspec.yaml -Destination pubspec.yaml.bak
        shell: powershell
      - run: flutter create --overwrite --org com.safekey.app --project-name safekey .
      - run: |
          Copy-Item main.dart.bak -Destination lib/main.dart
          Copy-Item pubspec.yaml.bak -Destination pubspec.yaml
        shell: powershell
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with: { name: SafeKey-Windows, path: build/windows/x64/runner/Release/ }

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.5', channel: 'stable' }
      - run: rm -rf android ios windows linux macos web
      - run: |
          mkdir -p /tmp/bak
          cp lib/main.dart /tmp/bak/main.dart
          cp pubspec.yaml /tmp/bak/pubspec.yaml
      - run: flutter create --overwrite --org com.safekey.app --project-name safekey .
      - run: |
          cp /tmp/bak/main.dart lib/main.dart
          cp /tmp/bak/pubspec.yaml pubspec.yaml
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libsecret-1-0
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Fix json.hpp for Linux Clang 18
        run: |
          find linux -name "json.hpp" -exec sed -i 's/operator"" _json/operator""_json/g; s/operator"" _json_pointer/operator""_json_pointer/g' {} +
          echo "Patched json.hpp"
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with: { name: SafeKey-Linux, path: build/linux/x64/release/bundle/ }

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.5', channel: 'stable' }
      - run: rm -rf android ios windows linux macos web
      - run: |
          mkdir -p /tmp/bak
          cp lib/main.dart /tmp/bak/main.dart
          cp pubspec.yaml /tmp/bak/pubspec.yaml
      - run: flutter create --overwrite --org com.safekey.app --project-name safekey .
      - run: |
          cp /tmp/bak/main.dart lib/main.dart
          cp /tmp/bak/pubspec.yaml pubspec.yaml
      - run: flutter config --enable-macos-desktop --enable-ios
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with: { name: SafeKey-macOS, path: build/macos/Build/Products/Release/ }
