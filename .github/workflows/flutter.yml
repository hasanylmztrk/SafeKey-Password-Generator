name: Flutter Build - All Platforms
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: 'stable' }
      - name: Ana kodu yedekle
        run: cp lib/main.dart /tmp/main.dart.bak
      - name: Eksik Flutter klasörlerini oluştur
        run: flutter create . --org com.safekey.app --project-name safekey
      - name: Ana kodu geri yükle
        run: cp /tmp/main.dart.bak lib/main.dart
      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: SafeKey-Android-APK, path: build/app/outputs/flutter-apk/app-release.apk }

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: 'stable' }
      - run: Copy-Item lib/main.dart -Destination $env:TEMP/main.dart.bak
        shell: powershell
      - run: flutter create . --org com.safekey.app --project-name safekey
      - run: Copy-Item $env:TEMP/main.dart.bak -Destination lib/main.dart
        shell: powershell
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with: { name: SafeKey-Windows, path: build/windows/x64/runner/Release/ }

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: 'stable' }
      - run: cp lib/main.dart /tmp/main.dart.bak
      - run: flutter create . --org com.safekey.app --project-name safekey
      - run: cp /tmp/main.dart.bak lib/main.dart
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with: { name: SafeKey-Linux, path: build/linux/x64/release/bundle/ }

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: 'stable' }
      - run: cp lib/main.dart /tmp/main.dart.bak
      - run: flutter create . --org com.safekey.app --project-name safekey
      - run: cp /tmp/main.dart.bak lib/main.dart
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with: { name: SafeKey-macOS, path: build/macos/Build/Products/Release/ }
