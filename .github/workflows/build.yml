name: Build All
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-Android-APK
          path: bin/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install kivy pyinstaller
      - run: pyinstaller --onefile --windowed --name SafeKey main.py
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-Windows-EXE
          path: dist/SafeKey.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install kivy pyinstaller
      - run: pyinstaller --onefile --windowed --name SafeKey main.py
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-macOS-App
          path: dist/SafeKey.app

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libgstreamer1.0-dev
          pip install kivy pyinstaller
      - run: pyinstaller --onefile --windowed --name SafeKey main.py
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-Linux
          path: dist/SafeKey
