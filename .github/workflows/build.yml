name: Build All
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade buildozer Cython==0.29.36
      - name: Build APK
        run: |
          rm -rf .buildozer
          buildozer -v android debug
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-Android-APK
          path: bin/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install kivy pyinstaller
      - run: pyinstaller --onefile --windowed --name SafeKey main.py
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-Windows-EXE
          path: dist/SafeKey.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install kivy pyinstaller
      - run: pyinstaller --onefile --windowed --name SafeKey main.py
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-macOS-App
          path: dist/SafeKey.app

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libgstreamer1.0-dev
          pip install kivy pyinstaller
      - run: pyinstaller --onefile --windowed --name SafeKey main.py
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-Linux
          path: dist/SafeKey
