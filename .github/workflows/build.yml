name: Build SafeKey

on: [push]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          workdir: .
      - name: APK Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: safekey-android
          path: bin/*.apk
