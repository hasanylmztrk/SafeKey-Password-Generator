name: Build All

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "kivy[base]==2.3.0" pyinstaller
      - name: Build EXE
        env:
          KIVY_WINDOW: sdl2
          KIVY_GL_BACKEND: angle_sdl2
          KIVY_NO_ARGS: 1
        run: |
          pyinstaller --onefile --windowed --name SafeKey main.py
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-Windows-EXE
          path: dist/SafeKey.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install kivy==2.3.0 pyinstaller
      - name: Build APP
        run: |
          pyinstaller --onefile --windowed --name SafeKey main.py
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-macOS-App
          path: dist/SafeKey.app

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install kivy==2.3.0 pyinstaller
      - name: Build Binary
        env:
          KIVY_WINDOW: sdl2
          KIVY_GL_BACKEND: sdl2
        run: |
          pyinstaller --onefile --name SafeKey main.py
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-Linux-Binary
          path: dist/SafeKey

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Buildozer deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libncurses5-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 Cython==0.29.36
      - name: Build APK
        run: |
          rm -rf .buildozer bin
          yes | buildozer -v android debug
      - uses: actions/upload-artifact@v5
        with:
          name: SafeKey-Android-APK
          path: bin/*.apk
